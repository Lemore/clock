<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שעון חלל</title>
<style>
  :root {
    --glow-cyan: #7df9ff;
    --glow-pink: #ff6ec7;
    --glow-purple: #b388ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #1b1340 0%, #0d0a2b 35%, #05040f 75%, #000000 100%);
    font-family: 'Courier New', 'Consolas', monospace;
  }

  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  .nebula {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 20%, rgba(179, 136, 255, 0.18) 0%, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(125, 249, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 70% 15%, rgba(255, 110, 199, 0.10) 0%, transparent 30%);
    mix-blend-mode: screen;
  }

  .planet {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
  }

  .planet.saturn {
    width: 150px;
    height: 150px;
    top: 10%;
    left: 8%;
    background: radial-gradient(circle at 35% 30%, #ffd9a0, #d9883b 55%, #7a4a1e 100%);
    box-shadow: 0 0 40px rgba(255, 180, 90, 0.35), inset -15px -10px 30px rgba(0,0,0,0.5);
    animation: float1 9s ease-in-out infinite;
  }
  .planet.saturn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 230px;
    height: 60px;
    border: 3px solid rgba(255, 224, 170, 0.55);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
    box-shadow: 0 0 12px rgba(255, 210, 150, 0.4);
  }

  .planet.moon {
    width: 70px;
    height: 70px;
    bottom: 12%;
    right: 10%;
    background: radial-gradient(circle at 40% 35%, #e8e8f0, #9a9ab0 60%, #55556a 100%);
    box-shadow: 0 0 25px rgba(200, 200, 255, 0.3), inset -10px -8px 20px rgba(0,0,0,0.5);
    animation: float2 11s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(3deg); }
  }
  @keyframes float2 {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(22px); }
  }

  .clock-wrap {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  #time {
    font-size: clamp(3.2rem, 14vw, 10rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #eafcff;
    text-shadow:
      0 0 10px var(--glow-cyan),
      0 0 25px var(--glow-cyan),
      0 0 55px rgba(125, 249, 255, 0.6),
      0 0 90px rgba(179, 136, 255, 0.4);
    user-select: none;
    direction: ltr;
  }

  #time .colon {
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  #date {
    font-size: clamp(1rem, 2.6vw, 1.6rem);
    color: var(--glow-purple);
    letter-spacing: 0.15em;
    text-shadow: 0 0 12px rgba(179, 136, 255, 0.7);
    direction: ltr;
  }

  .panel {
    padding: 2.5rem 4rem;
    border-radius: 28px;
    background: rgba(10, 8, 30, 0.35);
    border: 1px solid rgba(125, 249, 255, 0.25);
    box-shadow:
      0 0 40px rgba(125, 249, 255, 0.15),
      inset 0 0 60px rgba(125, 249, 255, 0.05);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .seconds-ring {
    position: absolute;
    width: min(70vw, 560px);
    height: min(70vw, 560px);
    border-radius: 50%;
    border: 1px solid rgba(125, 249, 255, 0.15);
    pointer-events: none;
    z-index: 1;
  }
  .seconds-ring.outer {
    width: min(80vw, 640px);
    height: min(80vw, 640px);
    border-color: rgba(179, 136, 255, 0.12);
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="nebula"></div>
  <div class="planet saturn"></div>
  <div class="planet moon"></div>

  <div class="clock-wrap">
    <div class="seconds-ring outer"></div>
    <div class="seconds-ring"></div>
    <div class="panel">
      <div id="time">00:00:00</div>
      <div id="date">YYYY-MM-DD</div>
    </div>
  </div>

<script>
  // Digital clock
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    const h = pad(now.getHours());
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());
    document.getElementById('time').innerHTML =
      `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}`;

    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const dayName = days[now.getDay()];
    const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} · ${dayName}`;
    document.getElementById('date').textContent = dateStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Starfield
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], shootingStars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    const count = Math.floor((W * H) / 2200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      baseAlpha: Math.random() * 0.6 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 'cyan' : 'pink') : 'white'
    }));
  }

  function spawnShootingStar() {
    const startX = Math.random() * W * 0.7 + W * 0.15;
    const startY = Math.random() * H * 0.3;
    const angle = Math.PI / 4 + (Math.random() * 0.3 - 0.15);
    const speed = Math.random() * 6 + 8;
    shootingStars.push({
      x: startX, y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      trail: []
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      s.phase += s.twinkleSpeed;
      const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
      let color;
      if (s.hue === 'cyan') color = `rgba(125, 249, 255, ${alpha})`;
      else if (s.hue === 'pink') color = `rgba(255, 110, 199, ${alpha})`;
      else color = `rgba(255, 255, 255, ${alpha})`;

      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

      if (s.r > 1.2) {
        ctx.beginPath();
        ctx.strokeStyle = color.replace(/[\d.]+\)$/, '0.15)');
        ctx.lineWidth = s.r * 2;
        ctx.moveTo(s.x - 4, s.y);
        ctx.lineTo(s.x + 4, s.y);
        ctx.moveTo(s.x, s.y - 4);
        ctx.lineTo(s.x, s.y + 4);
        ctx.stroke();
      }
    }

    shootingStars = shootingStars.filter(sh => sh.life > 0);
    for (const sh of shootingStars) {
      sh.trail.push({ x: sh.x, y: sh.y });
      if (sh.trail.length > 18) sh.trail.shift();
      sh.x += sh.vx;
      sh.y += sh.vy;
      sh.life -= 0.012;

      for (let i = 0; i < sh.trail.length; i++) {
        const p = sh.trail[i];
        const t = i / sh.trail.length;
        ctx.beginPath();
        ctx.fillStyle = `rgba(234, 252, 255, ${t * sh.life * 0.8})`;
        ctx.arc(p.x, p.y, t * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (sh.x > W + 50 || sh.y > H + 50) sh.life = 0;
    }

    if (Math.random() < 0.006 && shootingStars.length < 3) spawnShootingStar();

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
</script>
</body>
</html>
